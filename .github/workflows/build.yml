name: Build and Release WarLink

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Install dependencies
        run: go mod tidy

      - name: Compile WarLink.exe
        run: |
          go build -ldflags="-H windowsgui -s -w" -o WarLink.exe .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarLink-Windows-amd64
          path: WarLink.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WarLink.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
