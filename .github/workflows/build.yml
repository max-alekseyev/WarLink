name: Build and Release WarLink

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WarLink (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: Verify Go modules
        run: go mod tidy

      - name: Compile WarLink.exe
        run: |
          go build -ldflags="-H windowsgui -s -w" -o WarLink.exe .

      - name: Generate SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path WarLink.exe -Algorithm SHA256).Hash
          "$hash  WarLink.exe" | Out-File -Encoding ascii WarLink.exe.sha256
          Write-Host "WarLink.exe SHA256: $hash"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WarLink-Windows-amd64
          path: |
            WarLink.exe
            WarLink.exe.sha256
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WarLink.exe
            WarLink.exe.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

