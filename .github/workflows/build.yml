name: Build and Release WarLink

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build WarLink (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Verify Go modules
        run: go mod tidy

      - name: Compile WarLink.exe
        shell: pwsh
        env:
          GW_IP: ${{ secrets.OFFICIAL_GATEWAY_IP }}
          GW_PORTS: ${{ vars.OFFICIAL_GATEWAY_PORTS || '443,20000-30000' }}
          OBFS_PASS: ${{ secrets.OFFICIAL_OBFS_PASSWORD }}
          HMAC_SEC: ${{ secrets.OFFICIAL_HMAC_SECRET }}
          REPO_NAME: ${{ vars.OFFICIAL_UPDATE_REPO || github.repository }}
        run: |
          $flags = @(
            "-H windowsgui",
            "-s",
            "-w",
            "-X warlink/internal/updater.UpdateRepo=$env:REPO_NAME"
          )

          if ($env:GITHUB_REF_NAME) {
            $flags += "-X main.AppVersion=$env:GITHUB_REF_NAME"
          }

          if ($env:GW_IP) {
            $flags += "-X warlink/internal/singbox.DefaultServerIP=$env:GW_IP"
            $flags += "-X warlink/internal/singbox.DefaultServerAPI=http://$env:GW_IP"
            $flags += "-X warlink/internal/config.DefaultServerIP=$env:GW_IP"
          }
          if ($env:GW_PORTS) {
            $flags += "-X warlink/internal/singbox.DefaultServerPorts=$env:GW_PORTS"
          }
          if ($env:OBFS_PASS) {
            $flags += "-X warlink/internal/singbox.DefaultObfsPassword=$env:OBFS_PASS"
          }
          if ($env:HMAC_SEC) {
            $flags += "-X warlink/internal/singbox.DefaultHMACSecret=$env:HMAC_SEC"
          }

          $ldflagsStr = $flags -join " "
          Write-Host "[BUILD] Compiling WarLink.exe with -trimpath and ldflags..."
          go build -trimpath -tags release -ldflags "$ldflagsStr" -o WarLink.exe .

      - name: Generate SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path WarLink.exe -Algorithm SHA256).Hash
          "$hash  WarLink.exe" | Out-File -Encoding ascii WarLink.exe.sha256
          Write-Host "WarLink.exe SHA256: $hash"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WarLink-Windows-amd64
          path: |
            WarLink.exe
            WarLink.exe.sha256
          retention-days: 14

      - name: Prepare Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $notes = ""
          # 1. Try to extract tag annotation message preserving newlines
          $tagLines = git tag -l --format='%(contents)' ${{ github.ref_name }}
          if ($tagLines) {
            $tagText = ($tagLines -join "`n").Trim()
            if ($tagText -and $tagText -ne "${{ github.ref_name }}") {
              $notes = $tagText
            }
          }
          # 2. Fallback to commit message body
          if (-not $notes) {
            $commitLines = git log -1 --pretty=%B
            $commitText = ($commitLines -join "`n").Trim()
            if ($commitText -match '(?s)^release:\s*[^\r\n]+\r?\n(.*)$') {
              $notes = $matches[1].Trim()
            } elseif ($commitText) {
              $notes = $commitText
            }
          }
          if (-not $notes) {
            $notes = "Релиз ${{ github.ref_name }}"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText("release_notes.md", $notes, $utf8NoBom)
          Write-Host "[RELEASE] Release notes prepared for ${{ github.ref_name }}."

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            WarLink.exe
            WarLink.exe.sha256
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


