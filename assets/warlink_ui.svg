<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" width="520" height="370">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0px; }
      .mono { font-family: "Consolas", "Apercu Mono Pro", "Courier New", monospace; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="0.5" y="0.5" width="519" height="369" fill="#111111" stroke="#222222" stroke-width="1" rx="2" />

  <!-- Technical Frameless Titlebar -->
  <line x1="0" y1="36" x2="520" y2="36" stroke="#202020" stroke-width="1" />

  <!-- Titlebar Left: Brand -->
  <text x="16" y="22.5" class="sans" font-size="11" font-weight="700" letter-spacing="1" fill="#f5f5f5">WARLINK</text>
  <text x="82" y="22.5" class="mono" font-size="10" fill="#737373">v2.0.4</text>

  <!-- Titlebar Center: Airplane-Style Toggle (Free Internet) -->
  <rect x="165" y="6" width="188" height="24" rx="2" fill="#161616" stroke="#292929" stroke-width="1" />
  
  <!-- Lucide Globe Icon -->
  <g transform="translate(173, 10)" stroke="#737373" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="7" />
    <path d="M8 1a10.5 10.5 0 0 0 0 14 10.5 10.5 0 0 0 0-14" />
    <path d="M1 8h14" />
  </g>

  <!-- Toggle Title -->
  <text x="197" y="22" class="sans" font-size="11" font-weight="500" fill="#a3a3a3">Свободный интернет</text>

  <!-- Switch Pill -->
  <rect x="320" y="11" width="24" height="14" rx="7" fill="#222222" stroke="#292929" stroke-width="1" />
  <circle cx="327" cy="18" r="4.5" fill="#666666" />

  <!-- Titlebar Right: Window Controls -->
  <!-- Settings Button -->
  <g transform="translate(420, 10)" stroke="#737373" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.447 2.757a1.56 1.56 0 0 1 3.106 0 1.56 1.56 0 0 0 2.213 1.277 1.56 1.56 0 0 1 1.553 2.689 1.56 1.56 0 0 0 0 2.554 1.56 1.56 0 0 1-1.553 2.689 1.56 1.56 0 0 0-2.213 1.277 1.56 1.56 0 0 1-3.106 0 1.56 1.56 0 0 0-2.213-1.277 1.56 1.56 0 0 1-1.553-2.689 1.56 1.56 0 0 0 0-2.554 1.56 1.56 0 0 1 1.553-2.689 1.56 1.56 0 0 0 2.213-1.277z" />
    <circle cx="8" cy="8" r="2" />
  </g>

  <!-- Minimize Button -->
  <g transform="translate(456, 10)" stroke="#737373" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="8" x2="13" y2="8" />
  </g>

  <!-- Close Button -->
  <g transform="translate(492, 10)" stroke="#737373" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="3" x2="13" y2="13" />
    <line x1="13" y1="3" x2="3" y2="13" />
  </g>

  <!-- Main Body: Games Showcase Header -->
  <text x="20" y="65" class="sans" font-size="11" font-weight="700" letter-spacing="0.8" fill="#888888">ВИТРИНА ИГР</text>
  <line x1="20" y1="76" x2="500" y2="76" stroke="#202020" stroke-width="1" />

  <!-- Shortcuts Grid -->
  <!-- Shortcut 1: WARDOGS -->
  <g transform="translate(32, 94)">
    <image x="11" y="2" width="56" height="56" href="data:image/png;base64," />
    <text x="39" y="74" class="sans" font-size="11" font-weight="700" fill="#ff5e1f" text-anchor="middle">WARDOGS</text>
  </g>

  <!-- Shortcut 2: Add Game -->
  <g transform="translate(126, 94)">
    <circle cx="39" cy="28" r="27" fill="none" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="3.5 3.5" />
    <g stroke="#666666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="29" y1="28" x2="49" y2="28" />
      <line x1="39" y1="18" x2="39" y2="38" />
    </g>
    <text x="39" y="74" class="sans" font-size="11" font-weight="500" fill="#808080" text-anchor="middle">Добавить</text>
  </g>

  <!-- Persistent Stockholm Gateway Footer -->
  <rect x="0" y="338" width="520" height="32" fill="#131313" />
  <line x1="0" y1="338" x2="520" y2="338" stroke="#202020" stroke-width="1" />

  <!-- Footer Left: Gateway Meta -->
  <g transform="translate(14, 344)">
    <!-- Status Dot -->
    <circle cx="4" cy="10" r="3" fill="#00e676" />
    <!-- Gateway Name (Russian, identical to app) -->
    <text x="13" y="13.5" class="sans" font-size="11" font-weight="600" fill="#f5f5f5">Стокгольм</text>
    <!-- Separator -->
    <text x="75" y="13.5" class="sans" font-size="11" fill="#333333">•</text>
    <!-- Ping -->
    <text x="85" y="13.5" class="mono" font-size="11" fill="#737373">29 мс</text>
    <!-- Separator -->
    <text x="121" y="13.5" class="sans" font-size="11" fill="#333333">•</text>
    <!-- Slots -->
    <text x="131" y="13.5" class="mono" font-size="11" fill="#737373">0/100</text>
    <!-- Separator -->
    <text x="167" y="13.5" class="sans" font-size="11" fill="#333333">•</text>
    <!-- Days -->
    <text x="177" y="13.5" class="mono" font-size="11" fill="#737373">29 дн.</text>
  </g>

  <!-- Footer Right: Donate Button (Proportioned to strictly contain text with padding) -->
  <g transform="translate(326, 342)">
    <rect x="0" y="0" width="182" height="24" rx="2" fill="transparent" stroke="#282828" stroke-width="1" />
    <!-- Precise Credit Card Icon -->
    <g transform="translate(8, 7)" stroke="#ff5e1f" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="13" height="9" rx="1.2" />
      <line x1="0" y1="3" x2="13" y2="3" />
    </g>
    <!-- Button Text with zero kerning anomalies and ample right padding -->
    <text x="27" y="16" class="sans" font-size="11" font-weight="400" fill="#a3a3a3">Поддержать сервер (~98 ₽)</text>
  </g>
</svg>
