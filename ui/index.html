<!DOCTYPE html>
<html lang="ru" style="background-color: #111111; color: #f5f5f5;">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarLink</title>
    <style>
        html, body {
            background-color: #111111 !important;
            color: #f5f5f5 !important;
            margin: 0;
            padding: 0;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #111111; color: #f5f5f5;">
    <div class="app-window">
        <!-- Technical Frameless Titlebar -->
        <header class="titlebar" onmousedown="handleTitlebarMouseDown(event)">
            <div class="titlebar-left">
                <svg class="brand-mark" width="13" height="13" viewBox="0 0 24 24" fill="none">
                    <polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5" stroke="#444444" stroke-width="1.8" fill="#171717"/>
                    <polyline points="12,2 12,22" stroke="#2c2c2c" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="3.2" fill="#FF5E1F"/>
                    <path d="M4 8.5 L12 12 L20 8.5" stroke="#FF5E1F" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span class="brand-logo">WARLINK</span>
                <span class="brand-version">v1.0.0</span>
            </div>
            <div class="titlebar-right">
                <button id="btn-settings-toggle" class="win-btn win-icon-btn" onclick="toggleDetails(event)" title="Параметры маршрутизации">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button class="win-btn win-minimize" onclick="handleMinimize(event)" title="Свернуть">
                    <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
                </button>
                <button class="win-btn win-close" onclick="handleClose(event)" title="Закрыть">
                    <svg width="10" height="10" viewBox="0 0 10 10">
                        <path d="M1.2,1.2 L8.8,8.8 M8.8,1.2 L1.2,8.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Workspace: One Action, One Screen -->
        <main class="main-body">
            <!-- Normal Stage: Dominant Status & Action -->
            <div id="view-primary" class="primary-view">
                <div class="status-block">
                    <div id="badge-status" class="status-line status-standby">
                        <span class="status-dot"></span>
                        <span id="badge-text" class="status-heading">ГОТОВ</span>
                    </div>
                    <div id="status-desc" class="status-subtext">Система готова к оптимизации маршрута</div>
                </div>

                <div class="action-block">
                    <button id="btn-toggle" class="btn btn-primary" onclick="toggleConnect()">
                        <span id="btn-spinner" class="btn-spinner" style="display: none;"></span>
                        <span id="btn-text">ПОДКЛЮЧИТЬ</span>
                    </button>
                </div>

                <!-- Minimalist Linear Progress (Shown exclusively when connecting/optimizing) -->
                <div id="main-progress-box" class="progress-container" style="display: none;">
                    <div class="progress-meta">
                        <span id="main-progress-msg" class="progress-step">Подготовка...</span>
                        <span id="main-progress-pct" class="progress-val">0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="main-progress-fill" class="progress-bar" style="width: 0%;"></div>
                    </div>
                    <div id="pipeline-steps" class="pipeline-steps">
                        <span id="step-diag" class="step-item">1. Сеть</span>
                        <span class="step-sep">›</span>
                        <span id="step-zapret" class="step-item">2. Zapret</span>
                        <span class="step-sep">›</span>
                        <span id="step-warp" class="step-item">3. WARP</span>
                        <span class="step-sep">›</span>
                        <span id="step-ready" class="step-item">4. Готово</span>
                    </div>
                </div>
            </div>

            <!-- Progressive Disclosure: Secondary Settings/Details Panel -->
            <div id="view-details" class="details-view" style="display: none;">
                <div class="details-header">
                    <span class="details-title">Параметры маршрутизации</span>
                    <button class="details-close" onclick="toggleDetails(event)">Закрыть</button>
                </div>

                <div class="details-content">
                    <div class="setting-row">
                        <span class="setting-label">Профиль Zapret:</span>
                        <span id="active-profile" class="setting-mono">Определение...</span>
                    </div>

                    <div class="setting-row">
                        <label class="check-wrap">
                            <input type="checkbox" id="chk-autolaunch" onchange="onAutoLaunchChange()">
                            <span class="check-box"></span>
                            <span class="check-text">Автозапуск WARDOGS в Steam после подключения</span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span class="setting-label">Тестирование профилей:</span>
                        <button id="btn-run-test" class="btn-link" onclick="runZapretTest()">Тест Zapret (service 12) ▷</button>
                    </div>

                    <div class="setting-row">
                        <span class="setting-label">Журнал операций:</span>
                        <button class="btn-link" onclick="openLogFile()">Открыть warlink.log ↗</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Technical Muted Footer -->
        <footer class="footer-bar" onclick="openLogFile()" title="Открыть полный журнал warlink.log">
            <span id="last-log-msg" class="footer-msg">Готов к подключению</span>
            <span class="footer-link">LOG ↗</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
