<!DOCTYPE html>
<html lang="ru" style="background-color: #111111; color: #f5f5f5;">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarLink</title>
    <style>
        html, body {
            background-color: #111111 !important;
            color: #f5f5f5 !important;
            margin: 0;
            padding: 0;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body style="background-color: #111111; color: #f5f5f5;">
    <div class="app-window">
        <!-- Technical Frameless Titlebar -->
        <header class="titlebar" onmousedown="handleTitlebarMouseDown(event)">
            <div class="titlebar-left">
                <span class="brand-logo">WARLINK</span>
                <span class="brand-version">v2.1.6</span>
            </div>

            <!-- Global Airplane-Style Toggle: Free Internet -->
            <div class="titlebar-center">
                <div id="free-net-control" class="free-net-toggle" onclick="toggleFreeInternet(event)">
                    <svg class="free-net-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
                        <path d="M2 12h20"/>
                    </svg>
                    <span class="free-net-title">Свободный интернет</span>
                    <span id="free-net-switch" class="switch-pill">
                        <span class="switch-thumb"></span>
                    </span>
                </div>
            </div>

            <div class="titlebar-right">
                <button id="btn-account-toggle" class="win-btn win-icon-btn account-header-btn" onclick="toggleAccount(event)" title="Профиль и аккаунт">
                    <div class="header-avatar-circle">
                        <img id="header-avatar-img" class="header-avatar-img" src="" alt="" style="display: none;">
                        <svg id="header-avatar-svg" class="header-avatar-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </button>
                <button id="btn-sponsors-toggle" class="win-btn win-icon-btn" onclick="toggleSponsors(event)" title="Доска почёта спонсоров">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
                        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                        <path d="M4 22h16"/>
                        <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"/>
                        <path d="M6 4h12v7a6 6 0 0 1-12 0V4z"/>
                    </svg>
                </button>
                <button id="btn-notif-toggle" class="win-btn win-icon-btn notif-btn-wrap" onclick="toggleNotifications(event)" title="Уведомления">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span id="notif-badge" class="notif-badge" style="display: none;">0</span>
                </button>
                <button id="btn-settings-toggle" class="win-btn win-icon-btn" onclick="toggleDetails(event)" title="Параметры маршрутизации">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
                <button class="win-btn win-minimize" onclick="handleMinimize(event)" title="Свернуть">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <button class="win-btn win-close" onclick="handleClose(event)" title="Закрыть">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="main-body">
            <!-- VIEW 1: Games Shortcuts Showcase -->
            <div id="view-showcase" class="showcase-view">
                <div class="showcase-header">
                    <span class="showcase-title">ВИТРИНА ИГР</span>
                    <span class="showcase-hint font-mono" style="font-size: 10px; color: var(--text-muted); line-height: 1;">Клик — запуск • ПКМ — меню</span>
                </div>

                <div class="details-content">
                    <div id="showcase-grid" class="shortcuts-grid">
                        <div class="game-shortcut is-selected" data-game-id="wardogs" onclick="onGameClick('wardogs')" oncontextmenu="showGameContextMenu(event, 'wardogs', true)">
                            <div class="shortcut-icon-wrapper">
                                <img class="shortcut-icon-img" src="wardogs_icon.png" alt="WARDOGS" draggable="false">
                            </div>
                            <span class="shortcut-title" title="WARDOGS">WARDOGS</span>
                        </div>
                        <div class="game-shortcut add-shortcut" id="btn-add-game" onclick="openAddGameModal()" title="Предложить или проголосовать за новую игру">
                            <div class="shortcut-icon-wrapper add-icon-wrap">
                                <svg class="add-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </div>
                            <span class="shortcut-title">Предложить</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mount points for decomposed views and modals -->
            <div data-partial="views/settings-view.html"></div>
            <div data-partial="views/notifications-view.html"></div>
            <div data-partial="views/sponsors-view.html"></div>
            <div data-partial="views/account-view.html"></div>
            <div data-partial="views/add-game-modal.html"></div>
            <div data-partial="views/donate-modal.html"></div>
            <div data-partial="views/dossier-modal.html"></div>

            <!-- VIEW: Blocking Auto-Updater Overlay -->
            <div id="view-update-overlay" class="update-overlay" style="display: none;">
                <div class="update-box">
                    <svg class="update-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF5E1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M8 16H3v5" />
                    </svg>
                    <h3 id="update-title" class="update-title">Обновление WarLink...</h3>
                    <div id="update-msg" class="update-msg">Подготовка к загрузке обновления...</div>
                    <div class="progress-track">
                        <div id="update-bar" class="progress-bar" style="width: 0%;"></div>
                    </div>
                    <div id="update-note" class="update-note">Пользовательские настройки и список игр гарантированно сохранены</div>
                </div>
            </div>

            <!-- Toast Notification (Non-blocking alert banner) -->
            <div id="ui-toast" class="ui-toast" style="display: none;">
                <svg class="toast-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span id="ui-toast-msg" class="toast-msg"></span>
            </div>
        </main>

        <!-- Persistent Stockholm Gateway & Community Timer Bar -->
        <footer class="gateway-footer">
            <div class="gateway-footer-left">
                <span class="gateway-dot"></span>
                <span class="gateway-title">Стокгольм</span>
                <span class="gateway-sep">•</span>
                <span id="gw-ping" class="gateway-meta"><span class="skeleton" style="width: 36px; height: 10px;"></span></span>
                <span class="gateway-sep">•</span>
                <span id="gw-slots" class="gateway-meta" title="Слоты шлюза"><span class="skeleton" style="width: 30px; height: 10px;"></span></span>
                <span class="gateway-sep">•</span>
                <span id="gw-days" class="gateway-meta"><span class="skeleton" style="width: 38px; height: 10px;"></span></span>
            </div>
            <button id="btn-donate-server" class="btn-donate-server" onclick="openDonateModal(event)" title="Поддержать сервер через СБП">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                </svg>
                <span id="btn-donate-text">Поддержать сервер</span>
            </button>
        </footer>
    </div>

    <!-- Game Context Menu (RMB on Game Card) -->
    <div id="game-context-menu" class="context-menu" style="display: none;">
        <button class="context-menu-item" id="ctx-btn-connect" onclick="onContextConnect()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
            </svg>
            <span>Подключиться</span>
        </button>
        <button class="context-menu-item" id="ctx-btn-autolaunch" onclick="onContextToggleAutolaunch()">
            <svg class="ctx-check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span id="ctx-autolaunch-label">Автозапуск при подключении</span>
        </button>
        <div class="context-menu-divider"></div>
        <button class="context-menu-item item-danger" id="ctx-btn-delete" onclick="onContextDelete()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M3 6h18"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span>Удалить</span>
        </button>
    </div>

    <!-- Modular Script Bundle -->
    <script src="js/foley.js"></script>
    <script src="js/audio.js"></script>
    <script src="app.js"></script>
    <script src="js/voting.js"></script>
    <script src="js/dossier.js"></script>
    <script src="js/sponsors.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
