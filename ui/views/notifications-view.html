<!-- VIEW: In-App Notifications Center -->
<div id="view-notifications" class="details-view" style="display: none;">
    <div class="details-header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="details-title">Центр уведомлений</span>
            <span id="notif-count-tag" class="votes-badge">0</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn-link" style="font-size: 11px; color: var(--text-muted); cursor: pointer;" onclick="markAllNotificationsRead()">Прочитать все</button>
            <button class="details-close" onclick="toggleNotifications(event)">Закрыть</button>
        </div>
    </div>
    <div class="details-content" id="notifications-list">
        <div class="notification-card skeleton-card">
            <div class="notif-header">
                <div class="notif-title-row">
                    <div class="skeleton" style="width: 52px; height: 16px; border-radius: 2px;"></div>
                    <div class="skeleton" style="width: 140px; height: 13px;"></div>
                </div>
                <div class="skeleton" style="width: 48px; height: 10px;"></div>
            </div>
            <div class="skeleton" style="width: 90%; height: 11px; margin-top: 4px;"></div>
            <div class="skeleton" style="width: 60%; height: 11px; margin-top: 2px;"></div>
        </div>
        <div class="notification-card skeleton-card">
            <div class="notif-header">
                <div class="notif-title-row">
                    <div class="skeleton" style="width: 52px; height: 16px; border-radius: 2px;"></div>
                    <div class="skeleton" style="width: 170px; height: 13px;"></div>
                </div>
                <div class="skeleton" style="width: 48px; height: 10px;"></div>
            </div>
            <div class="skeleton" style="width: 85%; height: 11px; margin-top: 4px;"></div>
        </div>
    </div>
</div>
