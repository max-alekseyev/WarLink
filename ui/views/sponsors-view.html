<!-- VIEW: Sponsors Hall of Fame Page -->
<div id="view-sponsors" class="details-view">
    <div class="details-header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="details-title">Доска почёта спонсоров</span>
            <span id="sponsors-count-badge" class="votes-badge">0</span>
        </div>
        <button class="details-close" onclick="toggleSponsors(event)">Закрыть</button>
    </div>
    <div class="details-content">
        <!-- Community Goal & Server Support Box -->
        <div class="community-goal-box">
            <div class="goal-header">
                <div class="goal-title-wrap">
                    <span class="goal-label">Обеспечение инфраструктуры</span>
                    <span class="goal-sub">Шлюзы поддерживаются силами игрового сообщества</span>
                </div>
                <div id="goal-timer-wrap" class="goal-timer-badge">
                    <span id="goal-timer-label">Старт статистики с 1 октября:</span>
                    <span id="goal-timer-countdown" class="goal-timer-time font-mono">--:--:--</span>
                </div>
            </div>
            
            <div class="goal-nodes-grid">
                <!-- 1. Stockholm Node -->
                <div id="goal-node-stockholm" class="goal-node-item">
                    <div class="node-item-top">
                        <div class="node-identity">
                            <svg class="node-flag" width="16" height="11" viewBox="0 0 16 11" fill="none">
                                <rect width="16" height="11" rx="1" fill="#005293"/>
                                <rect x="5" width="2" height="11" fill="#FFCD00"/>
                                <rect y="4.5" width="16" height="2" fill="#FFCD00"/>
                            </svg>
                            <div class="node-name-wrap">
                                <span class="node-name">Стокгольм</span>
                                <span class="node-role font-mono">ОСНОВНОЙ ШЛЮЗ</span>
                            </div>
                        </div>
                        <div class="node-cost-wrap font-mono">
                            <span class="node-cost">2 €</span>
                            <span class="node-period">/ мес</span>
                        </div>
                    </div>
                    <div class="node-progress-wrap">
                        <div class="node-progress-bar">
                            <div id="stockholm-progress-fill" class="node-progress-fill" style="width: 0%;"></div>
                        </div>
                        <div class="node-progress-labels font-mono">
                            <span id="stockholm-progress-text">Собрано: 0 € из 2 €</span>
                            <span id="stockholm-progress-pct">0%</span>
                        </div>
                    </div>
                </div>

                <!-- 2. Frankfurt Node -->
                <div id="goal-node-frankfurt" class="goal-node-item">
                    <div class="node-item-top">
                        <div class="node-identity">
                            <svg class="node-flag" width="16" height="11" viewBox="0 0 16 11" fill="none">
                                <rect width="16" height="3.67" rx="1" fill="#202020"/>
                                <rect y="3.67" width="16" height="3.67" fill="#DD1111"/>
                                <rect y="7.33" width="16" height="3.67" rx="1" fill="#FFCE00"/>
                            </svg>
                            <div class="node-name-wrap">
                                <span class="node-name">Франкфурт</span>
                                <span class="node-role font-mono">РЕЗЕРВНЫЙ УЗЕЛ</span>
                            </div>
                        </div>
                        <div class="node-cost-wrap font-mono">
                            <span class="node-cost">12 €</span>
                            <span class="node-period">/ мес</span>
                        </div>
                    </div>
                    <div class="node-progress-wrap">
                        <div class="node-progress-bar">
                            <div id="frankfurt-progress-fill" class="node-progress-fill" style="width: 0%;"></div>
                        </div>
                        <div class="node-progress-labels font-mono">
                            <span id="frankfurt-progress-text">Собрано: 0 € из 12 €</span>
                            <span id="frankfurt-progress-pct">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="sponsors-nav-tabs">
            <button id="tab-sponsors-all" class="sponsor-tab-btn active" onclick="switchSponsorCategory('all')">Зал славы</button>
            <button id="tab-sponsors-month" class="sponsor-tab-btn" onclick="switchSponsorCategory('month')">Герои месяца</button>
            <button id="tab-sponsors-new" class="sponsor-tab-btn" onclick="switchSponsorCategory('new')">Новые защитники</button>
        </div>

        <div id="sponsors-grid" class="sponsors-grid"></div>
    </div>
</div>
