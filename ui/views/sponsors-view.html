<!-- VIEW: Sponsors Hall of Fame Page -->
<div id="view-sponsors" class="details-view">
    <div class="details-header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="details-title">Доска почёта спонсоров</span>
            <span id="sponsors-count-badge" class="votes-badge">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
            <button type="button" class="btn-author-donate" onclick="openDonateModalWithTab('boosty', event)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span>Донат автору</span>
            </button>
            <button class="details-close" onclick="toggleSponsors(event)">Закрыть</button>
        </div>
    </div>
    <div class="details-content">
        <!-- Ultra-compact Infrastructure Goal Strip (Variant A: 34px height) -->
        <div class="community-goal-box compact-goal-strip">
            <div class="compact-strip-left font-mono">
                <div class="compact-node-item covered" id="goal-node-infra" title="Обслуживание инфраструктуры кластера: Стокгольм + Москва + Франкфурт (13 € / мес)">
                    <div class="compact-flags">
                        <!-- Швеция (Стокгольм Master) -->
                        <svg class="node-flag" width="12" height="9" viewBox="0 0 16 11" fill="none">
                            <rect width="16" height="11" rx="1" fill="#005293"/>
                            <rect x="5" width="2" height="11" fill="#FFCD00"/>
                            <rect y="4.5" width="16" height="2" fill="#FFCD00"/>
                        </svg>
                        <!-- Россия (Москва Ingress Edge) -->
                        <svg class="node-flag" width="12" height="9" viewBox="0 0 16 11" fill="none">
                            <rect width="16" height="3.67" rx="1" fill="#FFFFFF"/>
                            <rect y="3.67" width="16" height="3.67" fill="#0039A6"/>
                            <rect y="7.33" width="16" height="3.67" rx="1" fill="#D52B1E"/>
                        </svg>
                        <!-- Германия (Франкфурт Gaming Edge) -->
                        <svg class="node-flag" width="12" height="9" viewBox="0 0 16 11" fill="none">
                            <rect width="16" height="3.67" rx="1" fill="#202020"/>
                            <rect y="3.67" width="16" height="3.67" fill="#DD1111"/>
                            <rect y="7.33" width="16" height="3.67" rx="1" fill="#FFCE00"/>
                        </svg>
                    </div>
                    <span class="compact-node-title">Инфраструктура кластера (13 € / мес):</span>
                    <div class="compact-mini-bar" style="width: 50px;">
                        <div id="infra-progress-fill" class="compact-mini-fill" style="width: 100%;"></div>
                    </div>
                    <span id="infra-progress-pct" class="compact-node-pct">100%</span>
                </div>
            </div>

            <div class="compact-strip-right font-mono">
                <span id="goal-timer-wrap" class="compact-period-label">
                    <span id="goal-timer-label" style="display:none;"></span>
                    <span id="goal-timer-countdown">Октябрь 2026</span>
                </span>
                <button type="button" class="btn-compact-donate" onclick="openDonateModalWithTab('server', event)">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FF5E1F" stroke-width="2.5"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                    <span>Поддержать шлюз</span>
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="sponsors-nav-tabs">
            <button id="tab-sponsors-all" class="sponsor-tab-btn active" onclick="switchSponsorCategory('all')">Зал славы</button>
            <button id="tab-sponsors-month" class="sponsor-tab-btn" onclick="switchSponsorCategory('month')">Герои месяца</button>
            <button id="tab-sponsors-new" class="sponsor-tab-btn" onclick="switchSponsorCategory('new')">Новые защитники</button>
        </div>

        <div id="sponsors-grid" class="sponsors-grid"></div>
    </div>
</div>
